services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codenter_sdr_postgres
    restart: always
    environment:
      POSTGRES_DB: codenter_sdr
      POSTGRES_USER: sdr_admin
      POSTGRES_PASSWORD: sdr_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr_admin -d codenter_sdr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codenter_sdr_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
